<!DOCTYPE html>
<html lang="en">
<head>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: #060907;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 16px;
        }

        h2 {
            color: #39E75F;
            text-align: center;
            margin: 0 0 10px;
        }

        /* ---------- responsive two-column layout ---------- */
        .form-container {
            display: flex;
            flex-wrap: wrap;
            align-items: stretch;
            gap: 0;
            width: 900px;
            max-width: 94%;
            margin: 40px auto;
            background-color: #0B120D;
            border: 1px solid #1B241D;
            border-radius: 15px;
            overflow: hidden;
        }

        .form-col {
            flex: 1 1 380px;
            padding: 30px;
            min-width: 0;
            order: 1;
        }

        .art-col {
            flex: 1 1 300px;
            min-width: 260px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at 50% 30%, rgba(57,231,95,0.10), transparent 65%);
            border-left: 1px solid #1B241D;
            order: 2;
        }

        @media (max-width: 700px) {
            .art-col {
                border-left: none;
                border-top: 1px solid #1B241D;
            }
        }

        /* ---------- animated illustration ---------- */
        .art-icon {
            width: 130px;
            height: 130px;
            margin-bottom: 18px;
            animation: floatIcon 3.4s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-12px); }
        }

        .art-icon .ring {
            transform-origin: 60px 60px;
            animation: spinRing 9s linear infinite;
        }
        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .art-icon .pulse-dot {
            animation: pulseDot 1.8s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: .4; r: 3; }
            50%      { opacity: 1; r: 5; }
        }

        .art-col h1 {
            font-size: 22px;
            margin: 0 0 8px;
            color: #F3F6F3;
            opacity: 0;
            animation: fadeUp .7s ease forwards .15s;
        }
        .art-col p {
            font-size: 14px;
            color: #93A093;
            margin: 0 0 26px;
            max-width: 30ch;
            opacity: 0;
            animation: fadeUp .7s ease forwards .3s;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ---------- chatty social icons ---------- */
        .social-row {
            display: flex;
            gap: 22px;
            opacity: 0;
            animation: fadeUp .7s ease forwards .45s;
        }

        .social-btn {
            position: relative;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 1px solid #1B241D;
            background: #0D1610;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #93A093;
            text-decoration: none;
            cursor: pointer;
            animation: chatBob 2.6s ease-in-out infinite;
            transition: color .2s ease, border-color .2s ease, transform .2s ease;
        }
        .social-btn svg { width: 22px; height: 22px; }

        .social-btn.insta   { animation-delay: 0s; }
        .social-btn.fb      { animation-delay: .35s; }
        .social-btn.twitter { animation-delay: .7s; }

        @keyframes chatBob {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25%      { transform: translateY(-7px) rotate(-4deg); }
            50%      { transform: translateY(0) rotate(0deg); }
            75%      { transform: translateY(-3px) rotate(4deg); }
        }

        .social-btn:hover {
            color: #39E75F;
            border-color: #1D6E38;
            animation-play-state: paused;
            transform: translateY(-6px) scale(1.08);
        }

        .social-btn .bubble {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translate(-50%, 6px) scale(0.85);
            margin-bottom: 10px;
            background: #101C13;
            border: 1px solid #1D6E38;
            color: #F3F6F3;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            padding: 6px 12px;
            border-radius: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .2s ease, transform .2s ease;
        }
        .social-btn .bubble::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: #1D6E38;
        }
        .social-btn:hover .bubble {
            opacity: 1;
            transform: translate(-50%, 0) scale(1);
        }

        @media (prefers-reduced-motion: reduce) {
            .social-btn { animation: none !important; }
        }

        /* ---------- form fields ---------- */
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #1B241D;
            border-radius: 8px;
            background-color: #060907;
            color: white;
            font-size: 15px;
            box-sizing: border-box;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #39E75F;
        }

        .error {
            color: #ff5c5c;
            font-size: 13px;
            margin-top: 5px;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 25px;
            background-color: #39E75F;
            color: #04170A;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #2ED158;
        }

        #success {
            color: #39E75F;
            text-align: center;
            margin-top: 15px;
        }

        @media (prefers-reduced-motion: reduce) {
            .art-icon, .art-icon .ring, .art-icon .pulse-dot, .art-col h1, .art-col p, .social-row {
                animation: none !important;
                opacity: 1 !important;
                transform: none !important;
            }
        }
    </style>
</head>

<body>
    <h2>Contact Web Zelora</h2>

    <div class="form-container">

        <div class="form-col">
            <form id="contactForm">

                <!-- Name -->
                <label for="name">Name</label>
                <input type="text" id="name" placeholder="Enter your name">
                <div id="nameError" class="error"></div>

                <!-- Email -->
                <label for="email">Email</label>
                <input type="text" id="email" placeholder="Enter your email">
                <div id="emailError" class="error"></div>

                <!-- Message -->
                <label for="message">Message</label>
                <textarea id="message" placeholder="Enter your message"></textarea>
                <div id="messageError" class="error"></div>

                <button type="submit">Submit</button>

                <div id="success"></div>

<script>

    // Get the form
    let form = document.getElementById("contactForm");


    form.addEventListener("submit", function(event) {

        // Prevent page refresh
        event.preventDefault();


        // Get input values
        let name = document.getElementById("name").value.trim();

        let email = document.getElementById("email").value.trim();

        let mobile = document.getElementById("mobile").value.trim();

        let message = document.getElementById("message").value.trim();


        // Error elements
        let nameError = document.getElementById("nameError");

        let emailError = document.getElementById("emailError");

        let mobileError = document.getElementById("mobileError");

        let messageError = document.getElementById("messageError");

        let success = document.getElementById("success");


        // Clear previous messages
        nameError.innerHTML = "";
        emailError.innerHTML = "";
        mobileError.innerHTML = "";
        messageError.innerHTML = "";
        success.innerHTML = "";


        // =========================
        // REGULAR EXPRESSIONS
        // =========================

        // Name:
        // Only letters and spaces
        let nameRegex = /^[A-Za-z ]{3,30}$/;


        // Email:
        // Example: example@gmail.com
        let emailRegex = /^[A-Za-z0-9._%+-]+@gmail\.com$/;


        // Mobile:
        // Must start with 6, 7, 8 or 9
        // Total 10 digits
        let mobileRegex = /^[6-9][0-9]{9}$/;


        // =========================
        // VALIDATION
        // =========================

        let valid = true;


        // Name validation
        if (!nameRegex.test(name)) {

            nameError.innerHTML =
                "Name must contain only letters and spaces (3-30 characters).";

            valid = false;
        }


        // Email validation
        if (!emailRegex.test(email)) {

            emailError.innerHTML =
                "Enter a valid Gmail address.";

            valid = false;
        }


        // Mobile validation
        if (!mobileRegex.test(mobile)) {

            mobileError.innerHTML =
                "Mobile must contain 10 digits and start with 6, 7, 8 or 9.";

            valid = false;
        }


        // Message validation
        if (message.length < 10) {

            messageError.innerHTML =
                "Message must contain at least 10 characters.";

            valid = false;
        }


        // =========================
        // SUCCESS
        // =========================

        if (valid) {

            success.innerHTML =
                "Form submitted successfully!";

            // Clear form
            form.reset();
        }

    });

</script>
